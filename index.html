<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;height:100vh;background:#fff0f3;overflow:hidden;display:flex;align-items:center;justify-content:center}
#card{
  width:240px;height:320px;position:relative;
  transform-style:preserve-3d;transition:0.8s;
  z-index:10;
}
#card.flip{transform:rotateY(180deg)}
.front,.back{
  position:absolute;width:100%;height:100%;backface-visibility:hidden;
  border-radius:20px;display:flex;align-items:center;justify-content:center;
  flex-direction:column;text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}
.front{background:#FFC2D1;color:white;font-family:cursive;font-size:22px}
.back{
  background:white;
  transform:rotateY(180deg);
  font-family:cursive;
  font-size:26px;
  line-height:1.3;
  color:#222;
  /* YE HAI PINK SHADOW */
  text-shadow: 2px 2px 0px #FFC2D1, 0px 0px 12px #ff8fab;
}
.b{position:fixed;bottom:-30px;animation:up linear forwards}
@keyframes up{to{transform:translateY(-130vh);opacity:0}}
</style>
</head>
<body>

<div id="card" onclick="this.classList.toggle('flip'); start()">
  <div class="front">🎂<br>Tap to Open<br>🎂</div>
  <div class="back">HAPPY<br>BIRTHDAY<br>TO<br>YOU<br>🎂</div>
</div>

<script>
let done=false;
function start(){
  if(done) return; done=true;
  setInterval(()=>{
    let b=document.createElement("div");
    b.className="b";
    b.innerText=["🎈","🎀","🍰","🎁","✨","❤️"][Math.floor(Math.random()*6)];
    b.style.left=Math.random()*90+"%";
    b.style.fontSize=(20+Math.random()*20)+"px";
    b.style.animationDuration=(3+Math.random()*2)+"s";
    document.body.appendChild(b);
    setTimeout(()=>b.remove(),5000);
  },250);
}
</script>
</body>
</html>
